async function saveCheck(){
  const p = current(); if(!p) return;
  const g = id => document.getElementById(id).value;
  const date = g('c-date'); if(!date) return notify('점검 날짜를 선택해 주세요.');
  if (editingLogId) {
    const l = p.logs.find(x => x.id===editingLogId);
    if (!l) { cancelEdit(); return; }
    const wasLeave = l.leave==='이탈';
    Object.assign(l, { date, badge:g('c-badge'), vest:g('c-vest'), attitude:g('c-attitude'), leave:g('c-leave'), memo:g('c-memo').trim() });
    saveData(false);
    const s = stats(p);
    editingLogId = null;
    if (!wasLeave && l.leave==='이탈') {
      await notify(`근무지 이탈로 수정되어 -1점이 생겼습니다. (누적 ${s.penalty}점)` + (s.leaves >= MAX_LEAVE ? `\n\n⚠️ 누적 -${MAX_LEAVE}점으로 중도포기 처리되었습니다.` : ''));
      await smsDialog(p, date, s.leaves);
    } else {
      notify('점검 기록이 수정되었습니다.' + (wasLeave && l.leave!=='이탈' ? `\n이탈이 취소되어 감점이 빠졌습니다. (누적 ${s.penalty}점)` : ''));
    }
    cancelEdit();
    return;
  }
  const log = { id: Date.now(), date, badge:g('c-badge'), vest:g('c-vest'), attitude:g('c-attitude'),
    leave:g('c-leave'), memo:g('c-memo').trim() };

  if (log.leave==='이탈' && p.logs.some(l => l.date===date && l.leave==='이탈'))
    if (!await ask('같은 날짜에 이미 이탈 기록이 있습니다. 한 번 더 감점할까요?')) return;

  p.logs.push(log);
  p.phone = g('m-phone').trim();
  saveData(false);
  const s = stats(p);

  if (log.leave==='이탈') {
    let msg = `근무지 이탈 -1점 (누적 ${s.penalty}점), 당일 일당 미지급입니다.`;
    if (s.leaves >= MAX_LEAVE) msg += `\n\n⚠️ 누적 -${MAX_LEAVE}점으로 중도포기 처리되었습니다.`;
    await notify(msg);
    await smsDialog(p, date, s.leaves);
  } else {
    notify('점검 기록이 저장되었습니다.');
  }
  document.getElementById('c-memo').value = '';
  renderModal();
}

async function deleteLog(logId){
  const p = current();
  if (!await ask('이 점검 기록을 지울까요? (잘못 입력한 경우에만 지워 주세요)')) return;
  p.logs = p.logs.filter(l => l.id !== logId);
  saveData(false); renderModal();
}

function saveInfo(){
  const p = current(); const g = id => document.getElementById(id).value.trim();
  if (!g('m-name')) return notify('성명은 비워 둘 수 없습니다.');
  Object.assign(p, { town:g('m-town'), name:g('m-name'), age:g('m-age'), senior:g('m-senior'), phone:g('m-phone'), address:g('m-address') });
  delete p.guess;   // 저장하면 확인된 경로당
  saveData(false); renderModal(); notify('인적사항이 저장되었습니다.');
}

async function toggleQuit(){
  const p = current();
  if (!stats(p).quitNow && !await ask(`${p.name} 어르신을 본인 사정으로 인한 중도포기로 처리할까요?`)) return;
  p.quit = !(stats(p).quitNow); p.quitYear = viewYear(); saveData(false); renderModal();
}

async function deleteParticipant(){
  const p = current();
  if (!await ask(`${p.name} 어르신을 명단에서 완전히 삭제할까요?\n점검 기록도 함께 사라집니다.\n(그만두신 경우에는 삭제 대신 "중도포기 처리"를 눌러 주세요)`)) return;
  participants = participants.filter(x => x.id !== p.id);
  saveData(); closeModal();
}

// ---------- 달마다 초기화 (비밀번호 1234) ----------
const RESET_PW = '1234';
function resetMonth(){
  const mk = monthKey();
  const logCnt = participants.reduce((n,p) => n + p.logs.filter(l => l.date.startsWith(mk)).length, 0);
  const chgCnt = participants.reduce((n,p) => n + (p.changes||[]).filter(c => c.from.startsWith(mk)).length, 0);
  const back = document.createElement('div'); back.className = 'dlg-back';
  back.innerHTML = `<div class="dlg">
    <div style="font-weight:bold;font-size:1.1rem;margin-bottom:6px;color:var(--danger);">🗑 ${YEAR}년 ${curMonth}월 초기화</div>
    <div style="margin-bottom:8px;">이 휴대폰에 저장된 <b>${curMonth}월 기록만</b> 지웁니다. 다른 달과 어르신 명단은 그대로예요.</div>
    <div class="notice red" style="margin-bottom:10px;">
      · 점검 기록(감점·조끼·명찰) <b>${logCnt}건</b><br>
      · 근무일 변경 <b>${chgCnt}건</b><br>
      · ${curMonth}월 활동일 설정${workdays[mk]?'':' (아직 정하지 않음)'} · 출장 일정<br>
      <b>지운 뒤에는 되돌릴 수 없습니다.</b></div>
    <button class="secondary full" id="rs-export">📥 먼저 ${curMonth}월 엑셀 내려받기</button>
    <label style="margin-top:10px;">비밀번호를 누르세요</label>
    <input type="password" id="rs-pw" inputmode="numeric" maxlength="8" placeholder="비밀번호 4자리" autocomplete="off">
    <div class="grid-2"><button class="secondary" id="rs-cancel">취소</button><button class="danger" id="rs-ok">초기화</button></div></div>`;
  document.body.appendChild(back);
  back.querySelector('#rs-export').onclick = () => exportExcel();
  back.querySelector('#rs-cancel').onclick = () => back.remove();
  back.querySelector('#rs-ok').onclick = async () => {
    const pw = back.querySelector('#rs-pw');
    if (pw.value !== RESET_PW) { pw.value = ''; pw.focus(); return notify('비밀번호가 맞지 않습니다.'); }
    if (!await ask(`정말 ${YEAR}년 ${curMonth}월 기록을 모두 지울까요?`)) return;
    participants.forEach(p => {
      p.logs = p.logs.filter(l => !l.date.startsWith(mk));
      if (p.changes) p.changes = p.changes.filter(c => !c.from.startsWith(mk));
    });
    delete workdays[mk]; store('jinan_workdays', JSON.stringify(workdays));
    Object.keys(trips).filter(d => d.startsWith(mk)).forEach(d => delete trips[d]); store('jinan_trips', JSON.stringify(trips));
    saveData(false); back.remove(); renderList();
    notify(`${YEAR}년 ${curMonth}월 기록을 초기화했습니다.`);
  };
}

// ---------- 날씨 (진안군 현재 날씨: 비 → 빗방울, 눈 → 눈송이) ----------
// 날씨 정보는 Open-Meteo(무료·가입 없음)에서 받아요. 인터넷이 없으면 마지막 날씨를 씁니다.
const WX_LAT = 35.79, WX_LON = 127.42;   // 진안군
function wxKind(code){
  if ([71,73,75,77,85,86].includes(code)) return 'snow';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code)) return 'rain';
  return code <= 1 ? 'sun' : 'cloud';
}
function showWeather(kind, temp){
  const icon = {rain:'🌧 비', snow:'❄️ 눈', sun:'☀️ 맑음', cloud:'☁️ 흐림'}[kind] || '';
  document.getElementById('wx-label').textContent = icon ? `진안 ${icon}${temp!=null?` · ${Math.round(temp)}℃`:''}` : '';
  const layer = document.getElementById('wx-layer'); layer.innerHTML = '';
  const n = kind==='rain' ? 45 : kind==='snow' ? 35 : 0;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');
    el.className = kind==='rain' ? 'drop' : 'flake';
    el.style.left = (Math.random()*110) + '%';
    el.style.animationDuration = (kind==='rain' ? 0.7 + Math.random()*0.6 : 6 + Math.random()*6) + 's';
    el.style.animationDelay = (-Math.random()*8) + 's';
    if (kind==='snow') { el.textContent = '❄'; el.style.fontSize = (8 + Math.random()*10) + 'px'; el.style.opacity = .5 + Math.random()*.5; }
    layer.appendChild(el);
  }
}
async function loadWeather(){
  // 시험용: 주소 뒤에 ?weather=rain 또는 ?weather=snow
  const force = new URLSearchParams(location.search).get('weather');
  if (force) return showWeather(force, null);
  try { const c = JSON.parse(load('jinan_weather')); if (c) showWeather(c.kind, c.temp); } catch(e) {}
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${WX_LAT}&longitude=${WX_LON}&current=temperature_2m,weather_code&timezone=Asia%2FSeoul`);
    const j = await r.json();
    const kind = wxKind(j.current.weather_code), temp = j.current.temperature_2m;
    store('jinan_weather', JSON.stringify({kind, temp, at: Date.now()}));
    showWeather(kind, temp);
  } catch(e) { /* 인터넷이 없으면 마지막 날씨 그대로 */ }
}
setInterval(loadWeather, 30*60*1000);   // 30분마다 새로

// ---------- 엑셀 내려받기 ----------
function exportExcel(){
  const town0 = (document.getElementById('filter-town').value || '전체');
  const list = participants.filter(p => town0==='전체' ? visibleTowns().includes(p.town) : p.town===town0)
    .sort((a,b) => a.town.localeCompare(b.town) || (a.senior||'').localeCompare(b.senior||'') || a.name.localeCompare(b.name));
  if (!list.length) return notify('내려받을 명단이 없습니다.');
  const town = (document.getElementById('filter-town').value || '전체');

  const sheet1 = list.map(p => { const s = stats(p), m = mstats(p); return {
    '읍면':p.town, '경로당':p.senior, '경로당 확인':p.guess?'추정(확인 필요)':'', '성명':p.name, '나이':p.age, '연락처':p.phone, '주소':p.address,
    [`${curMonth}월 점검 횟수`]:mLogs(p).length, [`${curMonth}월 감점`]:-m.leaves.length, [`${curMonth}월 일당 미지급 일수`]:m.leaves.length,
    [`${curMonth}월 조끼 미착용`]:m.vest, [`${curMonth}월 명찰 미착용`]:m.badge, '누적 이탈 횟수':s.leaves, '누적 감점':s.penalty, '상태':s.status, '마지막 점검일':s.last,
    [`${curMonth}월 활동 날짜`]: personDays(p, monthKey()).map(d => Number(d.slice(8,10))).join(', '),
    [`${curMonth}월 활동일 수`]: personDays(p, monthKey()).length,
    '근무일 변경': changesIn(p, monthKey()).map(c => `${dd(c.from)}→${dd(c.to)}${c.reason?` (${c.reason})`:''}`).join(' / ') }; });

  const sheet2 = [];
  list.forEach(p => [...mLogs(p)].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l => sheet2.push({
    '점검일':l.date, '읍면':p.town, '경로당':p.senior, '성명':p.name, '명찰':l.badge, '조끼':l.vest,
    '응대 태도':l.attitude, '근무지 이탈':l.leave, '감점':l.leave==='이탈'?-1:0,
    '일당':l.leave==='이탈'?'미지급':'지급', '메모':l.memo })));

  const fname = `노인일자리_점검_${town==='전체' && !showOthers ? '내담당' : town}_${YEAR}년${curMonth}월`;

  if (typeof XLSX === 'undefined') { // 인터넷이 안 될 때는 CSV로
    const rows = [Object.keys(sheet1[0]), ...sheet1.map(r => Object.values(r))];
    const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = fname + '.csv'; a.click();
    return notify('인터넷 연결이 약해 참여자 현황만 CSV(엑셀에서 열림)로 저장했습니다. 점검 기록까지 받으려면 인터넷이 될 때 다시 눌러 주세요.');
  }
  // 마감 요약: 읍·면, 경로당별 이탈·조끼·명찰 횟수
  const mDays = monthDays(monthKey());
  const sum = [[`${YEAR}년 ${curMonth}월 마감 요약 (${town})`],
    [`${curMonth}월 활동일 (${mDays.length}일)${workdays[monthKey()]?'':' ※ 추천 날짜(확정 전)'}`, mDays.map(dd).join(', ')],
    ['근무일 변경 인원', `${list.filter(p => changesIn(p, monthKey()).length).length}명`],
    ['출장 일정', Object.keys(trips).filter(d => d.startsWith(monthKey())).sort().map(d => `${dd(d)} ${tripLong(d)}`).join(' / ') || '없음'], [],
    ['읍면','경로당','인원','이탈 감점(점)','조끼 미착용(회)','명찰 미착용(회)']];
  const tot = {n:0, pen:0, vest:0, badge:0};
  [...new Set(list.map(p => p.town))].forEach(tw => {
    const ps = list.filter(p => p.town===tw);
    const groups = {}; ps.forEach(p => (groups[seniorOf(p)] ||= []).push(p));
    const sub = {n:0, pen:0, vest:0, badge:0};
    Object.keys(groups).sort((a,b) => seniorRank(a)-seniorRank(b) || a.localeCompare(b)).forEach(k => {
      let pen=0, vest=0, badge=0; groups[k].forEach(p => { const m = mstats(p); pen += m.leaves.length; vest += m.vest; badge += m.badge; });
      sum.push([tw, k, groups[k].length, -pen, vest, badge]);
      sub.n += groups[k].length; sub.pen += pen; sub.vest += vest; sub.badge += badge;
    });
    sum.push([tw+' 소계', '', sub.n, -sub.pen, sub.vest, sub.badge], []);
    for (const k in tot) tot[k] += sub[k];
  });
  sum.push(['총계', '', tot.n, -tot.pen, tot.vest, tot.badge]);
  const wb = XLSX.utils.book_new();
  const ws0 = XLSX.utils.aoa_to_sheet(sum);
  ws0['!cols'] = [22,40,7,11,11,11].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws0, '마감 요약');
  const ws1 = XLSX.utils.json_to_sheet(sheet1);
  const ws2 = sheet2.length ? XLSX.utils.json_to_sheet(sheet2) : XLSX.utils.aoa_to_sheet([['점검 기록이 없습니다.']]);
  ws1['!cols'] = [8,14,10,6,15,22,11,9,15,13,13,11,9,18,13].map(w=>({wch:w}));
  ws2['!cols'] = [12,8,14,10,8,8,9,10,6,7,30].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws1, '참여자 현황');
  XLSX.utils.book_append_sheet(wb, ws2, '점검 기록');
  // 근무일 변경 시트
  const chgRows = [];
  list.forEach(p => changesIn(p, monthKey()).sort((a,b)=>a.from.localeCompare(b.from)).forEach(c => chgRows.push({
    '읍면':p.town, '경로당':seniorOf(p), '성명':p.name, '원래 근무일':c.from, '바꾼 날짜':c.to, '사유':c.reason,
    [`${curMonth}월 활동 날짜(변경 반영)`]: personDays(p, monthKey()).map(d => Number(d.slice(8,10))).join(', ') })));
  const ws3 = chgRows.length ? XLSX.utils.json_to_sheet(chgRows) : XLSX.utils.aoa_to_sheet([[`${curMonth}월 근무일 변경 인원이 없습니다.`]]);
  ws3['!cols'] = [8,14,10,12,12,20,30].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws3, '근무일 변경');
  XLSX.writeFile(wb, fname + '.xlsx');
}

fillTownSelects();
renderList();
loadWeather();
if (!participants.length) notify('처음 사용하시는군요!\n\n아래 "명단 관리"의 "📂 엑셀로 한번에 등록"을 눌러, 담당자에게 받은 명단 엑셀 파일을 한 번만 넣어 주세요.\n\n명단은 이 휴대폰에만 저장됩니다.');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
